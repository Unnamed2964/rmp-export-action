name: RMP Export
description: Export Rail Map Painter project JSON to SVG and WebP using a rmp-release.yml config.
author: Unnamed2964

inputs:
  config:
    description: Path to rmp-release.yml (relative to the calling repository root)
    required: false
    default: rmp-release.yml
  version:
    description: Release version substituted into %version% placeholders (e.g. 0.6.3 or v0.6.3)
    required: true
  export-id:
    description: Export only one target id from the config exports list
    required: false
  dry-run:
    description: Print planned actions without exporting
    required: false
    default: "false"

outputs:
  version:
    description: Normalized version string written into placeholders
  datetime:
    description: Datetime string written into placeholders (Asia/Shanghai)

runs:
  using: composite
  steps:
    - name: Install git
      shell: bash
      run: |
        if ! command -v git >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq git
        fi

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev

    - name: Export via RMP
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_EXPORT_ID: ${{ inputs.export-id }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${{ env.PATH }}
      run: node dist/action.js

branding:
  icon: map
  color: blue
