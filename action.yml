name: RMP Export
description: Export Rail Map Painter project JSON to SVG and WebP using an rmp-release-config.yml config.
author: Unnamed2964

inputs:
  config:
    description: Path to rmp-release-config.yml (relative to the calling repository root)
    required: false
    default: rmp-release-config.yml
  version:
    description: Release version substituted into %version% placeholders (e.g. 0.6.3 or v0.6.3)
    required: true
  export-id:
    description: Export only one target id from the config exports list
    required: false
  dry-run:
    description: Print planned actions without exporting
    required: false
    default: "false"

outputs:
  version:
    description: Normalized version string written into placeholders
  datetime:
    description: Datetime string written into placeholders (Asia/Shanghai)

runs:
  using: composite
  steps:
    - name: Install Noto CJK fonts
      shell: bash
      run: |
        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
        fi

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev && npx playwright install chromium

    - name: Export via RMP
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_EXPORT_ID: ${{ inputs.export-id }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=(--config "${GITHUB_WORKSPACE}/${INPUT_CONFIG}" --version "${INPUT_VERSION}")
        if [ -n "${INPUT_EXPORT_ID}" ]; then
          args+=(--export-id "${INPUT_EXPORT_ID}")
        fi
        if [ "${INPUT_DRY_RUN}" = "true" ]; then
          args+=(--dry-run)
        fi
        node "${{ github.action_path }}/dist/cli.js" "${args[@]}"

branding:
  icon: map
  color: blue
