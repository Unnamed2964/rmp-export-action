# Minimal example for a consumer repository.
# Place this file at the repository root as rmp-release.yml.

# Read export terms in the RMP export dialog for rmp.ref below, then set the same ref here.
# Playwright checks #agree_terms on your behalf at run time.
acceptRmpExportTermsForRef: rmp-6.0.22

placeholders:
  version: "%version%"
  datetime: "%datetime%"

rmp:
  repository: https://github.com/railmapgen/rmp.git
  ref: rmp-6.0.22

defaults:
  scale: 2.0
  whiteBackground: true

exports:
  - id: map
    source: RMP.json
    outputs:
      svg: RMP.svg
      webp: RMP.webp
    crop:
      x: 0
      y: 0
      width: 1000
      height: 1000
    watermark:
      anchor: bottom-right
      inset:
        x: 27
        y: 55
