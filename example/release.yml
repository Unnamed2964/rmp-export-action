# Example consumer workflow — copy to .github/workflows/release.yml in your map repository.
# Push a semver tag (e.g. v0.6.3) to export map assets and create a GitHub Release.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Export via RMP
        uses: Unnamed2964/rmp-export-action@v0
        with:
          config: rmp-release-config.yml
          version: ${{ steps.version.outputs.number }}

      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV" ]; then
            CHANGELOG_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          else
            CHANGELOG_URL="https://github.com/${REPO}/compare/${PREV}...${TAG}"
          fi
          ASSET_BASE="https://github.com/${REPO}/releases/download/${TAG}"
          {
            echo "**Full Changelog**: ${CHANGELOG_URL}"
            echo ""
            echo "<img alt=\"Map\" src=\"${ASSET_BASE}/RMP.webp\" />"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            RMP.svg
            RMP.webp
